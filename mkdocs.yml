site_name: h2pcontrol
site_description: A distributed experiment control system — experiment framework, GUI, service registry and gRPC device servers.
site_url: https://h2pcontrol.torbenfreise.dev/
repo_url: https://github.com/torbenfreise/h2pcontrol
repo_name: torbenfreise/h2pcontrol
edit_uri: edit/main/docs/
copyright: MIT licensed

# Broken links and bad nav refs fail the build locally, not just in CI.
strict: true

theme:
  name: material
  features:
    # Top-level nav sections render as tabs. This is the ecosystem hook: sibling
    # repos (sdk, manager, protos, device servers) become sibling tabs later
    # without disturbing existing URLs.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # A page's age is information: a reader inheriting this system should be able to see
  # that a guide has not been touched in two years.
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - mkdocstrings:
      handlers:
        python:
          # h2pcontrol is a namespace package with no __init__.py at its root, so
          # griffe needs src/ on its search path explicitly.
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            relative_crossrefs: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
            # Table of contents at the top of each module — gives a reader an index
            # of a module before the full signatures. Generated, so no prose to write.
            summary: true
            # Default is false, which silently drops undocumented objects — that hid
            # the whole events.py vocabulary and the AxisSpec subclasses. A signature
            # with no prose is still worth more to a reader than nothing.
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  # Material icon shortcodes (:material-flask:), used by the home page card grid.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - First experiment: getting-started/first-experiment.md
  - Guide:
      - guide/index.md
      - Experiments: guide/experiments.md
      - Parameters: guide/parameters.md
      - Results and views: guide/results-and-views.md
      - Scans: guide/scans.md
      - Devices: guide/devices.md
      - The GUI: guide/gui.md
      - Data format: guide/data-format.md
      - Examples: examples.md
      - Troubleshooting: troubleshooting.md
      - Glossary: glossary.md
  - Reference:
      - reference/index.md
      - Framework: reference/framework.md
      - Runtime: reference/runtime.md
      - CLI: reference/cli.md
  - Internals:
      - internals/index.md
      - Architecture: internals/architecture.md
      - Contributing: internals/contributing.md
  - Changelog: changelog.md
