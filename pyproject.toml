[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2pcontrol"
version = "0.1.0"
description = "The controller software"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Torben Freise", email = "torben.freise@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "beyer-labs-h2pcontrol-grpc-python>=1.80.dev0,<2",
    "beyer-labs-h2pcontrol-protocolbuffers-python>=34.dev0,<36",
    "beyer-labs-h2pcontrol-protocolbuffers-pyi>=34.dev0,<36",
    "beyer-labs-h2pcontrol-community-nipunn1313-mypy>=5.1.0.dev0,<6",
    "beyer-labs-h2pcontrol-community-nipunn1313-mypy-grpc>=5.1.0.dev0,<6",
    "protobuf>=7.34.1",
    "pint",
    "pyqtgraph",
    "numpy",
    "PyYAML",
    "pyserial",
    "h2pcontrol-sdk",
    "pyside6>=6.11.1",
    "qasync>=0.27.1",
    "pandas>=2.0",
    "tables>=3.11.1",
    "pandas-stubs~=3.0.3",
    "matplotlib>=3.11.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.11",
    "pyright>=1.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-qt>=4.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "T20"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
h2pcontrol = "h2pcontrol.controller.app:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv]
override-dependencies = ["protobuf>=7.34.1"]

[[tool.uv.index]]
url = "https://buf.build/gen/python"

[tool.uv.sources]
h2pcontrol-sdk = { git = "https://github.com/torbenfreise/h2pcontrol-sdk", rev = "0.2.7" }
